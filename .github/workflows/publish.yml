name: Publish to PyPI

# Tag a release to publish:
#   git tag v0.7.0 && git push origin v0.7.0
#
# Authentication is PyPI Trusted Publishing (OIDC) -- no API token is
# stored in this repo. One-time setup on PyPI:
#   https://pypi.org/manage/account/publishing/
#   project: advaita-smrti | owner: aaronjohnson | repo: advaita-smrti
#   workflow: publish.yml  | environment: pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A tag that disagrees with pyproject publishes the wrong version
      # under the right name, and PyPI versions are immutable. Fail first.
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Run tests before shipping
        run: |
          pip install --upgrade pip
          pip install -e ".[mcp]"
          python tests/run_tests.py

      - name: Build sdist and wheel
        run: |
          # readme_renderer[md] or twine silently SKIPS Markdown validation
          pip install --upgrade build twine 'readme_renderer[md]'
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # add a manual approval gate here if wanted
    permissions:
      id-token: write          # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
