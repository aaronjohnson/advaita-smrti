[project]
name = "advaita-smrti"
version = "0.7.0"
description = "Non-dual memory for structured knowledge elicitation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [
    { name = "Aaron Johnson", email = "4023+aaronjohnson@users.noreply.github.com" },
]
keywords = ["mcp", "memory", "claude", "agents", "knowledge-elicitation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
bench = ["clingo>=5.6"]

[project.scripts]
smrti = "smrti.cli:main"
smrti-mcp = "smrti.mcp:main"

[project.urls]
Homepage = "https://github.com/aaronjohnson/advaita-smrti"
Repository = "https://github.com/aaronjohnson/advaita-smrti"
Changelog = "https://github.com/aaronjohnson/advaita-smrti/blob/sutra/CHANGELOG.md"
Issues = "https://github.com/aaronjohnson/advaita-smrti/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smrti"]

[tool.hatch.build.targets.sdist]
# The repo root carries legacy modules (smrti.py, memory/, sea_*.py) that
# shadow the real package. Ship only what the wheel needs plus the tests.
include = [
    "/smrti",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/CLAUDE.md",
]
